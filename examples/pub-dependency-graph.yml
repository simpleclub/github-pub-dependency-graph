# Copy to .github/workflows/pub-dependency-graph.yml
name: Pub dependency graph

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2   # or dart-lang/setup-dart@v1 for pure Dart repositories
        with:
          channel: stable
          cache: true
      - uses: simpleclub/github-pub-dependency-graph@v1
